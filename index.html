<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кодер">
<title>Локальный кодер</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--side:#eceef2;--surf:#fff;--surf2:#e4e7ec;--line:#d8dce2;--text:#1a1d22;--muted:#5f6772;--acc:#1d6fa5;--acc-ink:#fff;--acc-soft:#d6e8f5;--err:#b3261e;--warn:#8a5a00;--ok:#2f7d4f;--code:#fbfbfc;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191d;--side:#1d2025;--surf:#262a31;--surf2:#2d323a;--line:#343a42;--text:#e7e9ec;--muted:#9aa2ad;--acc:#5aaee3;--acc-ink:#0d1a24;--acc-soft:#1f3442;--err:#ff8a80;--warn:#f2c46b;--ok:#7fd1a0;--code:#1b1e23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191d;--side:#1d2025;--surf:#262a31;--surf2:#2d323a;--line:#343a42;--text:#e7e9ec;--muted:#9aa2ad;--acc:#5aaee3;--acc-ink:#0d1a24;--acc-soft:#1f3442;--err:#ff8a80;--warn:#f2c46b;--ok:#7fd1a0;--code:#1b1e23;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.app{display:flex;height:100%}
.side{width:264px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px calc(10px + env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.01em;padding:6px 12px 18px}
.mark{width:18px;height:18px;border-radius:50%;border:3px solid var(--acc);box-shadow:0 0 0 3px var(--acc-soft);flex:none}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;color:var(--text);font:inherit;font-size:16px;border-radius:10px;text-align:left;cursor:pointer}
.nav:hover{background:var(--surf2)}
.nav.on{background:var(--surf);font-weight:600}
.nav.sm{display:block;font-size:14px;padding:8px 12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.sec{font-size:13px;color:var(--muted);padding:20px 12px 6px}
.recent{flex:1}
.pad{padding:4px 12px;font-size:14px}
.muted{color:var(--muted)}
.foot{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.link{display:block;width:100%;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;padding:7px 12px;cursor:pointer;text-align:left;border-radius:8px}
.link:hover{background:var(--surf2)}
.ver{font-size:12px;color:var(--muted);padding:6px 12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);min-height:58px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:600;margin:0;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconb{border:0;background:none;color:var(--text);font-size:24px;line-height:1;padding:4px 10px;border-radius:8px;cursor:pointer}
.iconb:hover{background:var(--surf2)}
.menu{display:none}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.view{flex:1;min-height:0;overflow:auto}
.btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.danger{color:var(--err)}
.btn.pri.danger{background:var(--err);border-color:var(--err);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:20px 18px 40px}
.list{display:flex;flex-direction:column;gap:2px;max-width:820px;margin:0 auto;padding:12px 18px}
.wrap .list{padding:0}
.row{display:flex;align-items:center;width:100%;border:0;background:none;color:var(--text);font:inherit;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer;gap:8px}
.row:hover{background:var(--surf2)}
.rmain{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.rt{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{font-size:13px;color:var(--muted);margin-top:2px}
.icon-btn{border:0;background:none;color:var(--muted);font-size:16px;padding:8px 10px;border-radius:8px;cursor:pointer}
.icon-btn:hover{color:var(--err)}
.empty{max-width:520px;margin:12vh auto 0;padding:0 24px;text-align:center}
.empty .big{font-size:22px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 18px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.desc{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--text);font:inherit;padding:10px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin:26px 0 8px}
.hrow h2{font-size:16px;margin:0}
.note{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.code{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.fname,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text)}
.fname{width:170px;font-family:var(--mono)}
.grow{flex:1}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
.ed{width:100%;height:100%;resize:none;border:0;border-right:1px solid var(--line);background:var(--code);color:var(--text);font:14px/1.55 var(--mono);padding:14px 16px;tab-size:2;outline:none;white-space:pre;overflow:auto}
.out{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--surf2);color:var(--text);font-weight:600}
.console{flex:1;overflow:auto;font:13px/1.5 var(--mono);padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.ln.err{color:var(--err)}.ln.warn{color:var(--warn)}.ln.info{color:var(--muted)}.ln.ret{color:var(--ok)}
.preview{flex:1;border:0;background:#fff;width:100%;min-height:0}
.art{display:flex;flex-direction:column;height:100%}
.art pre{margin:0;flex:1;overflow:auto;padding:16px;font:13px/1.55 var(--mono);background:var(--code)}
.hidden{display:none!important}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.mpw{padding:0 18px}
.mp{max-width:820px;margin:16px auto 4px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surf);display:flex;flex-direction:column;gap:10px}
.mpr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:13px}
.errt{color:var(--err)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:8px;flex:none}
.pbar{height:6px;border-radius:3px;background:var(--surf2);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.chat{display:flex;flex-direction:column;height:100%}
.mstat{display:flex;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line)}
.msgs{flex:1;min-height:0;overflow:auto;padding:8px 18px 24px}
.col{max-width:780px;margin:0 auto}
.hint{text-align:center;margin-top:10vh;padding:0 20px}
.mu{margin:18px 0 18px auto;width:fit-content;max-width:85%;background:var(--surf2);border-radius:14px;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.ma{margin:18px 0;line-height:1.55}
.tx{white-space:pre-wrap;word-break:break-word;margin:6px 0}
.tx code{font-family:var(--mono);font-size:.92em;background:var(--surf2);padding:1px 5px;border-radius:5px}
.cb{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--code)}
.cbh{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.cbh span{flex:1}
.cb pre{margin:0;padding:12px 14px;overflow:auto;font:13px/1.5 var(--mono)}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 18px 14px;border-top:1px solid var(--line)}
.comp textarea{flex:1;min-height:46px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--text);font:inherit;padding:11px 14px}
.pkgt{min-height:70px;font-family:var(--mono);font-size:13px}
.mt8{margin-top:8px}
.pk{border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-top:14px;overflow:hidden}
.pkh{display:flex;align-items:center;gap:8px;padding:12px 14px;flex-wrap:wrap}
.pkg{padding:0 14px 10px}
.tl{border-top:1px solid var(--line)}
.tl details{border-bottom:1px solid var(--line)}.tl details:last-child{border-bottom:0}
.tl summary{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none}
.tl summary::-webkit-details-marker{display:none}
.tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sti{width:18px;text-align:center;font-weight:700;flex:none}
.s-done{color:var(--ok)}.s-failed{color:var(--err)}.s-running{color:var(--acc)}.s-pending,.s-skipped{color:var(--muted)}
.td{padding:0 14px 12px 42px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tlog{font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px 10px;align-self:stretch}
@media (max-width:900px){.split{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.ed{border-right:0;border-bottom:1px solid var(--line)}}
@media (max-width:760px){.side{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}.side.open{transform:none}.scrim.open{display:block}.menu{display:inline-block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
<div class="brand"><span class="mark"></span>Локальный кодер</div>
<nav id="nav"></nav>
<div class="sec">Недавние проекты</div>
<div id="recent" class="recent"></div>
<div class="foot">
<button class="link" id="bkExport">Скачать резервную копию</button>
<button class="link" id="bkImport">Восстановить из копии</button>
<input type="file" id="bkFile" accept=".json,application/json" hidden>
<input type="file" id="pkgInput" accept=".json,.txt,application/json,text/plain" hidden>
<div class="ver">Версия <span id="ver"></span></div>
</div>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main">
<header class="top">
<button class="iconb menu" id="menuBtn" aria-label="Меню">☰</button>
<span id="backSlot"></span>
<h1 id="title"></h1>
<div id="topActions" class="top-actions"></div>
</header>
<section id="view" class="view"></section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const VERSION='0.4.1';
const $=s=>document.querySelector(s);
const V=()=>$('#view');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const EXT={js:'js',py:'py',html:'html'};
const LANGN={js:'JavaScript',py:'Python',html:'HTML'};
const SAMPLE={
js:"// JavaScript\nconst nums = [3, 1, 4, 1, 5, 9];\nconsole.log('Сумма:', nums.reduce((a, b) => a + b, 0));\nconsole.log('По возрастанию:', [...nums].sort((a, b) => a - b));\n",
py:"# Python\nnums = [3, 1, 4, 1, 5, 9]\nprint('Сумма:', sum(nums))\nprint('По возрастанию:', sorted(nums))\n",
html:"<!doctype html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"utf-8\">\n<style>body{font-family:system-ui;padding:20px}</style>\n</head>\n<body>\n<h1>Привет, Сэр</h1>\n<button onclick=\"console.log('Нажато')\">Нажать</button>\n</body>\n</html>\n"};
const IC={
chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
proj:'<svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg>',
code:'<svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>',
art:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>'};
const langOf=n=>{const e=String(n).split('.').pop().toLowerCase();return e==='py'?'py':(e==='html'||e==='htm')?'html':'js'};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const fmt=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const DEF_CODE=()=>({lang:'js',name:'main.js',text:SAMPLE.js,projectId:''});
let S={projects:[],artifacts:[],chats:[],settings:{model:''},code:DEF_CODE()};
const UI={view:'code',projectId:null,artifactId:null,artTab:'preview',log:[],running:false,tab:'console',lastHtml:'',chatId:null,draft:'',gen:false,pk:null,wl:null,openT:new Set(),pkgDraft:'',pkgNew:false};
function normalize(d){d=d||{};return{projects:Array.isArray(d.projects)?d.projects:[],artifacts:Array.isArray(d.artifacts)?d.artifacts:[],code:d.code&&typeof d.code.text==='string'?d.code:DEF_CODE(),chats:Array.isArray(d.chats)?d.chats:[],settings:d.settings&&typeof d.settings==='object'?d.settings:{model:''}}}
/* Хранилище: IndexedDB */
const DB={db:null,
open(){return new Promise(res=>{try{const r=indexedDB.open('local-coder',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null)}catch(e){res(null)}})},
set(k,v){return new Promise(res=>{if(!this.db)return res();try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}};
let saveT;
const flush=()=>{clearTimeout(saveT);return DB.set('state',JSON.parse(JSON.stringify(S)))};
const save=()=>{clearTimeout(saveT);saveT=setTimeout(flush,300)};
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const proj=id=>S.projects.find(p=>p.id===id);
const art=()=>S.artifacts.find(a=>a.id===UI.artifactId);
const touch=p=>{p.updated=Date.now();save()};
function newProject(n){const t=Date.now(),p={id:uid(),name:n,desc:'',files:[],created:t,updated:t};S.projects.push(p);save();return p}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:(type||'text/plain')+';charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
/* Каркас */
function header(t,actions,back){$('#backSlot').innerHTML=back?'<button class="iconb" data-act="back" aria-label="Назад">‹</button>':'';$('#title').textContent=t;$('#topActions').innerHTML=actions||''}
function empty(title,text,btn){return`<div class="empty"><div class="big">${title}</div><p>${text}</p>${btn||''}</div>`}
function renderNav(){
const N=[['chats','Чаты',IC.chat],['projects','Проекты',IC.proj],['code','Код',IC.code],['artifacts','Артефакты',IC.art]];
$('#nav').innerHTML=N.map(([k,l,i])=>`<button class="nav ${UI.view===k?'on':''}" data-go="${k}"><span class="ic">${i}</span>${l}</button>`).join('');
const r=S.projects.slice().sort((a,b)=>b.updated-a.updated).slice(0,6);
$('#recent').innerHTML=r.length?r.map(p=>`<button class="nav sm" data-proj="${p.id}">${esc(p.name)}</button>`).join(''):'<div class="muted pad">Пока пусто</div>';
}
function render(){renderNav();({chats:vChats,projects:vProjects,code:vCode,artifacts:vArts})[UI.view]()}
function go(v){if(v==='projects')UI.projectId=null;if(v==='artifacts')UI.artifactId=null;if(v==='chats')UI.chatId=null;UI.view=v;closeDrawer();render()}
function closeDrawer(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')};
$('#scrim').onclick=closeDrawer;
/* Нейросеть */
const WEBLLM_VERS=['0.2.79','0.2.78','0.2.75'];
const SYS='Ты локальный помощник-программист. Пиши рабочий код на JavaScript, Python или HTML. Код всегда помещай в блок ``` с указанием языка (javascript, python или html). Объясняй кратко и по-русски. Учитывай среду: код запускается в браузере; в Python нет input(), файлов и сети; в JavaScript нет DOM, кроме HTML-страниц. Если запрос неясен, сделай разумное допущение и назови его.';
/* 0.4.1: штраф за повторы выключен, иначе модель теряет повторяющиеся цифры (200 -> 20) */
const GEN={repetition_penalty:1.0,frequency_penalty:0,presence_penalty:0};
const DEAD='Модель выгружена системой и не перезапустилась';
const rc=()=>{if(UI.view==='chats')render()};
const LLM={lib:null,engine:null,state:'idle',progress:0,text:'',models:[],loaded:'',err:'',def:'',initing:false,
async init(){
if(this.lib||this.initing||this.state==='nogpu')return;
if(!navigator.gpu){this.state='nogpu';rc();return}
this.initing=true;this.state='idle';this.err='';
for(const v of WEBLLM_VERS){try{this.lib=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@'+v+'/+esm');break}catch(e){}}
this.initing=false;
if(!this.lib){this.state='error';this.err='Не удалось загрузить библиотеку нейросети. При первом запуске нужен интернет.';rc();return}
let f16=false;try{const a=await navigator.gpu.requestAdapter();f16=!!a&&a.features.has('shader-f16')}catch(e){}
const list=this.lib.prebuiltAppConfig.model_list,qs=f16?['q4f16_1','q4f32_1']:['q4f32_1'];
const pick=base=>{for(const q of qs){const r=list.find(m=>m.model_id===base+'-'+q+'-MLC');if(r)return r}};
const NOTE={'0.5B':'быстрая, простые задачи','1.5B':'основная','3B':'умнее, тяжелее'};
let rec=['Qwen2.5-Coder-0.5B-Instruct','Qwen2.5-Coder-1.5B-Instruct','Qwen2.5-Coder-3B-Instruct'].map(pick).filter(Boolean);
if(!rec.length)rec=list.filter(m=>/^Qwen2\.5-(0\.5|1\.5|3)B-Instruct/.test(m.model_id)&&qs.some(q=>m.model_id.includes(q)));

const lines=[],sink=(ty,s)=>lines.push({t:ty,s:String(s)});
const src=(deps?deps+'\n':'')+code+'\n'+(t.lang==='py'?pyHarness(t.tests):jsHarness(t.tests));
if(t.lang==='py')await runPy(src,sink,true);else await runJS(src,sink);
const mk=lines.find(l=>l.s.startsWith('__LKT__')),errs=lines.filter(l=>l.t==='err').map(l=>l.s).join('\n');
if(!mk)return{ok:false,summary:'ошибка выполнения',detail:(errs||'код не выполнился до проверок').slice(0,1000)};
let r;try{r=JSON.parse(mk.s.slice(7))}catch(e){return{ok:false,summary:'ошибка проверки',detail:'не удалось прочитать результат'}}
const pass=r.filter(x=>x.ok).length,fails=r.filter(x=>!x.ok).map(x=>'Проверка «'+t.tests[x.i]+'»: '+x.e).join('\n');
return{ok:pass===r.length,summary:r.length?'пройдено '+pass+' из '+r.length:'код выполнился без ошибок',detail:(fails||errs).slice(0,1000)}}
function upsertFile(p,name,text){const f=p.files.find(f=>f.name===name);if(f)f.text=text;else p.files.push({id:uid(),name,text})}
async function runTask(p,k,t){
t.status='running';t.log=[];t.lastError='';t.code='';
const deps=depCode(p,k,t);let code='',res=null;
for(let a=1;a<=3;a++){
if(UI.pk.stop)break;
const who=a===1?'Кодер':'Исправитель';t.stage=a===1?'Кодер пишет код':'Исправитель, попытка '+(a-1);rp(p);
let ans;try{ans=await llmAsk(a===1||!code?coderMsgs(k,t,deps):fixerMsgs(k,t,deps,code,res))}catch(e){const em=String(e&&e.message||e);t.log.push('Ошибка модели: '+em);res={ok:false,detail:'Ошибка модели: '+em};if(em===DEAD||isDead(e)){UI.pk.stop=true;UI.pk.dead=true}break}
if(UI.pk.stop)break;
const c=pickCode(ans,t.lang);
if(!c){t.log.push(who+': в ответе нет кода');res={ok:false,detail:'Ответ модели не содержит блока кода'};continue}
code=c;t.code=code;t.log.push(who+': '+code.split('\n').length+' строк'+(looping(ans)?' (обнаружено зацикливание, ответ оборван)':''));
t.stage='Тестировщик проверяет';rp(p);
res=await testCode(t,code,deps);t.log.push('Тестировщик: '+res.summary);
if(res.ok)break}
if(code)upsertFile(p,t.file,code);
if(UI.pk.stop&&!(res&&res.ok)){t.status='pending';t.stage='';t.log.push(UI.pk.dead?'Остановлено: модель выгружена':'Остановлено');rp(p);return}
t.status=res&&res.ok?'done':'failed';t.stage='';if(t.status==='failed')t.lastError=res?res.detail:'';touch(p);rp(p)}
async function runPackage(p,k){
if(UI.pk)return toast('Уже выполняется другой пакет');
if(UI.gen)return toast('Дождитесь окончания ответа в чате');
if(LLM.state!=='ready'||!LLM.engine){toast('Сначала запустите модель в разделе «Чаты»');return}
let order;try{order=topo(k.tasks)}catch(e){return toast('Ошибка пакета: '+e.message)}
UI.pk={id:k.id,stop:false,dead:false};
try{if(navigator.wakeLock)UI.wl=await navigator.wakeLock.request('screen')}catch(e){}
k.tasks.forEach(t=>{if(t.status!=='done'){t.status='pending';t.stage=''}});rp(p);
for(const t of order){
if(UI.pk.stop)break;if(t.status==='done')continue;
const bad=t.depends.find(d=>{const x=k.tasks.find(y=>y.id===d);return!x||x.status!=='done'});
if(bad){t.status='skipped';t.log=['Пропущено: зависимость '+bad+' не выполнена'];rp(p);continue}
await runTask(p,k,t)}
const stopped=UI.pk.stop,dead=UI.pk.dead;UI.pk=null;
try{if(UI.wl)await UI.wl.release()}catch(e){}UI.wl=null;
touch(p);rp(p);
const done=k.tasks.filter(t=>t.status==='done').length;
toast(dead?'Модель выгружена системой. Запустите её в «Чатах» и нажмите «Продолжить»':stopped?'Выполнение остановлено':'Пакет выполнен: готово '+done+' из '+k.tasks.length)}
$('#pkgInput').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{addPackage(await f.text(),UI.pkgNew)}catch(err){toast('Пакет не принят: '+err.message)}UI.pkgNew=false};
/* Резервная копия */
$('#bkExport').onclick=()=>{download('local-coder-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'local-coder',version:VERSION,data:S},null,1),'application/json')};
$('#bkImport').onclick=()=>$('#bkFile').click();
$('#bkFile').onchange=async e=>{
const f=e.target.files[0];e.target.value='';if(!f)return;
try{const j=JSON.parse(await f.text()),d=j.data||j;if(!Array.isArray(d.projects))throw 0;
if(!confirm('Заменить текущие данные резервной копией?'))return;
S=normalize(d);await flush();UI.projectId=UI.artifactId=null;render();toast('Данные восстановлены')}
catch(err){toast('Файл не похож на резервную копию этого приложения')}};
/* Старт */
(async()=>{
const verLbl=()=>{$('#ver').textContent=VERSION+(navigator.serviceWorker&&navigator.serviceWorker.controller?' · офлайн готов':'')};verLbl();
if('serviceWorker' in navigator){
navigator.serviceWorker.addEventListener('controllerchange',verLbl);
navigator.serviceWorker.register('./sw.js').catch(()=>{});
try{caches.open('lk-v1').then(c=>c.put(new URL('lk-py-worker.js',location.href),new Response(PY_WORKER,{headers:{'Content-Type':'text/javascript; charset=utf-8'}}))).then(()=>{UI.pyCached=true},()=>{})}catch(e){}}
await DB.open();
if(!DB.db)toast('Хранилище браузера недоступно: данные не сохранятся');
const d=await DB.get('state');if(d)S=normalize(d);
S.projects.forEach(p=>(p.packages||[]).forEach(k=>k.tasks.forEach(t=>{if(t.status==='running'){t.status='pending';t.stage=''}})));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render()})();
</script>
